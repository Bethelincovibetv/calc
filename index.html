<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGD Ad Network | Earnings Estimator</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper">
        <div class="estimator-card">
            <h1>GGD Earnings Estimator</h1>
            <div class="input-group">
                <label for="tasks">Number of Daily Tasks</label>
                <input type="number" id="tasks" placeholder="e.g. 10" min="0">
            </div>
            <div class="results">
                <div class="res-box">Daily: <span id="daily">0</span></div>
                <div class="res-box">Weekly: <span id="weekly">0</span></div>
                <div class="res-box">Monthly: <span id="monthly">0</span></div>
            </div>
            <a href="#" class="cta-button">JOIN NOW</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
