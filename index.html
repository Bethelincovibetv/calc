<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Calculator | Glassmorphism</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1>Earnings Estimator</h1>
            <p class="subtitle">Enter your daily metrics</p>
            <div class="input-group">
                <input type="number" id="tasks" placeholder="Tasks Per Day">
                <input type="number" id="profit" placeholder="Profit Per Task ($)">
            </div>
            <div class="result-container">
                <p>Total Daily Profit</p>
                <h2 id="daily">$0.00</h2>
            </div>
            <button class="cta-btn">Start Earning Today</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
