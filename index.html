<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="calculator-display" data-display>0</div>
            <div class="calculator-keys">
                <button class="key-clear span-2" data-clear>C</button>
                <button class="key-operator" data-delete>DEL</button>
                <button class="key-operator" data-operator>÷</button>
                <button class="key-number" data-number>7</button>
                <button class="key-number" data-number>8</button>
                <button class="key-number" data-number>9</button>
                <button class="key-operator" data-operator>×</button>
                <button class="key-number" data-number>4</button>
                <button class="key-number" data-number>5</button>
                <button class="key-number" data-number>6</button>
                <button class="key-operator" data-operator>−</button>
                <button class="key-number" data-number>1</button>
                <button class="key-number" data-number>2</button>
                <button class="key-number" data-number>3</button>
                <button class="key-operator" data-operator>+</button>
                <button class="key-number span-2" data-number>0</button>
                <button class="key-number" data-number>.</button>
                <button class="key-equals" data-equals>=</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
